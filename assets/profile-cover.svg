<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="480" viewBox="0 0 1200 480" role="img" aria-labelledby="title description">
  <title id="title">Muhammad Varian Warrick — UI/UX designer and builder</title>
  <desc id="description">An editorial, dark portfolio cover with cobalt, cyan and violet geometric canvas shapes forming a stylized W.</desc>
  <defs>
    <linearGradient id="surface" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#10131E"/>
      <stop offset="1" stop-color="#090B12"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#7558FF"/>
      <stop offset="0.55" stop-color="#2B8BFF"/>
      <stop offset="1" stop-color="#49E3DB"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#242A3B" stroke-width="1"/>
    </pattern>
    <clipPath id="crop"><rect width="1200" height="480" rx="24"/></clipPath>
  </defs>
  <g clip-path="url(#crop)">
    <rect width="1200" height="480" fill="url(#surface)"/>
    <rect x="769" width="431" height="480" fill="url(#grid)" opacity=".61"/>
    <path d="M769 0V480" stroke="#2B3040"/>
    <path d="M0 71H1200M0 408H1200" stroke="#2B3040"/>
    <rect x="44" y="30" width="9" height="9" transform="rotate(45 48.5 34.5)" fill="#52DBDC"/>
    <text x="69" y="39" fill="#E6E9F4" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" letter-spacing="3">VARIAN / WARRICK</text>
    <text x="730" y="39" fill="#8B93AB" font-family="Arial, Helvetica, sans-serif" font-size="11" letter-spacing="2" text-anchor="end">DESIGN × DEVELOPMENT</text>
    <text x="1160" y="39" fill="#8B93AB" font-family="Arial, Helvetica, sans-serif" font-size="11" letter-spacing="2" text-anchor="end">01 / PROFILE</text>

    <text x="60" y="112" fill="#70E3D9" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" letter-spacing="3">HELLO, I'M VARIAN  ↗</text>
    <text x="56" y="184" fill="#F5F5FA" font-family="Arial, Helvetica, sans-serif" font-size="57" font-weight="700" letter-spacing="-2">I design for people.</text>
    <text x="56" y="255" fill="#F5F5FA" font-family="Arial, Helvetica, sans-serif" font-size="57" font-weight="700" letter-spacing="-2">Then build to learn.</text>
    <rect x="60" y="284" width="76" height="4" rx="2" fill="url(#accent)"/>
    <text x="60" y="330" fill="#AEB6CB" font-family="Arial, Helvetica, sans-serif" font-size="18">UI/UX designer · Flutter maker · curious about better workflows</text>
    <rect x="60" y="355" width="238" height="32" rx="16" fill="#1B2031" stroke="#343A52"/>
    <circle cx="77" cy="371" r="4" fill="#70E3D9"/>
    <text x="91" y="376" fill="#DCE1EF" font-family="Arial, Helvetica, sans-serif" font-size="12" letter-spacing="1">JAKARTA, INDONESIA</text>

    <circle cx="980" cy="235" r="153" fill="#17213B" opacity=".58"/>
    <circle cx="980" cy="235" r="153" fill="none" stroke="#40496A" stroke-dasharray="3 10"/>
    <circle cx="980" cy="235" r="117" fill="none" stroke="#323C5B"/>
    <path d="M831 155L889 319L979 213L1071 319L1130 155" fill="none" stroke="#343D62" stroke-width="27" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M835 151L889 305L977 200" fill="none" stroke="url(#accent)" stroke-width="20" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M977 200L1071 305L1126 151" fill="none" stroke="url(#accent)" stroke-width="20" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="817" y="133" width="30" height="30" rx="5" fill="#121725" stroke="#66C9FF" stroke-width="3"/>
    <rect x="1113" y="133" width="30" height="30" rx="5" fill="#121725" stroke="#66C9FF" stroke-width="3"/>
    <rect x="963" y="186" width="28" height="28" rx="5" fill="#121725" stroke="#957BFF" stroke-width="3" transform="rotate(45 977 200)"/>
    <circle cx="889" cy="305" r="12" fill="#775DFF" stroke="#D0C6FF" stroke-width="2"/>
    <circle cx="1071" cy="305" r="12" fill="#4FCFD8" stroke="#BAF9F4" stroke-width="2"/>
    <text x="980" y="383" fill="#858FAB" font-family="Arial, Helvetica, sans-serif" font-size="11" letter-spacing="3" text-anchor="middle">IDEA  →  INTERFACE  →  PRODUCT</text>

    <text x="60" y="449" fill="#8F98AE" font-family="Arial, Helvetica, sans-serif" font-size="12" letter-spacing="2">SELECTED WORK / THOUGHTFUL INTERFACES</text>
    <text x="1140" y="449" fill="#8F98AE" font-family="Arial, Helvetica, sans-serif" font-size="12" letter-spacing="2" text-anchor="end">SCROLL TO EXPLORE  ↓</text>
